name: Lean checked formalization
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib cache
        run: python3 scripts/fetch_cache.py
      - name: Build supported modules and audit axioms
        run: python3 scripts/verify.py --sequential
      - name: Build Palomar statement and solution
        run: lake build +Challenge +Solution
      - name: Install Comparator sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Verify Comparator
        run: bash scripts/verify-comparator.sh
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lean-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/verification/full/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
