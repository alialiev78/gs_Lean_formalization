fidelity:
  divergences: The proofs use structured QR/RQ, explicit cosine-sine decompositions, horizontal slice
    atlases, matrix calculus and local topological models. The real singularity result covers all q >=
    3. Unitary topological nonmanifoldness is restricted to odd q. Unitary geometry is real differential
    geometry. Complete physical blocks may be shared within layers; partial-block and cross-layer ties
    are excluded. The comparator statements do not certify floating-point implementations, numerical experiments,
    global optimization convergence, arbitrary-depth rectangular products, arbitrary-overlap geodesic
    formulas or unfinished SU drafts.
