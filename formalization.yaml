version: v0.4
project:
  name: 'Structured orthogonal and unitary matrices: factorization, geometry and singularities'
  description: Block-diagonal matrix factors interleaved with fixed coordinate permutations define low-parametric
    matrix families. This formalization proves orthogonal-factor sufficiency for two and three real layers,
    its complex unitary analogue, and explicit four-layer counterexamples over both fields. It establishes
    an exact two-factor cell-rank criterion and real and unitary cosine-sine exhaustion for the (p,2,p)
    shuffle family. Two-layer images with complete within-layer block sharing, arbitrary overlap and arbitrary
    fixed carriers have a smooth atlas in the inherited matrix topology, an exact tangent image, a smooth
    Frobenius projector, a whole-tangent-bundle Cayley retraction and smooth intrinsic gradient sections.
    Shared orthogonal block exponential curves have normal ambient acceleration and constant Frobenius
    speed under the no-off-diagonal-overlap condition. Three-layer (2,q,2) families have genuine topological
    singularities for every real q >= 3 and for odd unitary q >= 3. The full supported proof library is
    included; experimental special-unitary drafts and the explicitly listed remaining problems are not
    claimed.
  authors:
  - Ali Aliev
  responsible_maintainers:
  - Ali Aliev
  license: MIT
